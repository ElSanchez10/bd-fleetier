# Base de datos de Fleetier: Postgres + instalador del esquema.
# El nombre del proyecto va fijo para que el volumen se llame siempre igual,
# sin importar desde qué carpeta se ejecute (workspace de Jenkins incluido).
name: fleetier-bd

services:
  db:
    image: postgres:16
    container_name: fleetier-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - interna    # solo la red interna; nunca la red proxy
    # Puerto para clientes SQL. Por defecto solo responde en la propia máquina;
    # cada servidor define en su .env dónde publicarlo (nunca en 0.0.0.0).
    ports:
      - "${DB_PUBLICAR:-127.0.0.1:5434}:5432"

  migrar:
    build: .
    restart: "no"   # corre una vez y termina
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - interna

volumes:
  db_data:

networks:
  interna:
    name: fleetier_interna   # el back se une a esta red como externa
